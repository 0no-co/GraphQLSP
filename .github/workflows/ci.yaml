name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Checks (TypeScript ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        typescript: [5.9.3, 6.0.3]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.3.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Use pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: pnpm-cache
        with:
          path: ${{ steps.pnpm-store.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Configure TypeScript ${{ matrix.typescript }}
        if: matrix.typescript != '6.0.3'
        run: node scripts/set-typescript-version.mjs ${{ matrix.typescript }}

      - name: Install Dependencies
        if: matrix.typescript == '6.0.3'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install Dependencies for compatibility test
        if: matrix.typescript != '6.0.3'
        run: pnpm install --no-frozen-lockfile --prefer-offline

      - name: Build
        run: pnpm --filter @0no-co/graphqlsp run build

      - name: Test
        run: pnpm run test:e2e

  typescript-7:
    name: TypeScript 7.1 API (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Prereleases and tsrs may break ahead of us, which shouldn't fail CI
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: typescript@beta
            compiler: typescript
            package: typescript-7@npm:typescript@beta
            experimental: false
          - name: typescript@next
            compiler: typescript
            package: typescript-7@npm:typescript@next
            experimental: true
          - name: tsrs@latest
            compiler: tsrs
            package: tsrs@latest
            experimental: true
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.3.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Use pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: pnpm-cache
        with:
          path: ${{ steps.pnpm-store.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # The TypeScript 7.1 API implementations are installed in the fixture
      # project, so they don't replace the workspace's TypeScript 5/6
      - name: Install ${{ matrix.name }}
        run: pnpm --filter ./test/e2e/fixture-project-ts7 add --save-dev ${{ matrix.package }}

      - name: Test
        run: pnpm exec vitest run test/e2e/ts7.test.ts test/e2e/ts7-session.test.ts
        env:
          GRAPHQLSP_TS7_COMPILER: ${{ matrix.compiler }}
