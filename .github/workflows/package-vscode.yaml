name: Package editor integration
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  editor:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vitest run test/e2e/ts7-session.test.ts test/e2e/lsp-proxy.test.ts test/e2e/lsp-shutdown.test.ts test/unit/lspProtocol.test.ts test/unit/schemaRecovery.test.ts test/unit/editVersions.test.ts test/unit/nativeMode.test.ts test/unit/vscode-ts7-features.test.ts --no-file-parallelism
        env:
          GRAPHQLSP_TS7_COMPILER: typescript
      - run: pnpm --filter vscode-graphqlsp package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graphqlsp-editor-${{ runner.os }}
          path: packages/vscode-graphqlsp/*.vsix
